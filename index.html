        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(650, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(180, audioCtx.currentTime + 0.04);
          gain.gain.setValueAtTime(0.04, audioCtx.currentTime);

        localStorage.setItem('kafaa_active_facility', activeFacilityId);
      }, [activeFacilityId]);

      useEffect(() => {
        document.title = 'مَنَصَّةُ كَفَاءةِ | الهيئة الوطنية لإدارة الطاقة';
      }, []);

      // Base Watts
      const baseWatts = useMemo(() => {
        if (!activeFacility || !activeFacility.devices) return 0;
        return activeFacility.devices
          .filter(d => d.isActive)
          .reduce((sum, d) => sum + (d.wattage * d.quantity), 0);
      }, [activeFacility]);

      // Monthly Total Energy (kWh)
      const monthlyTotalKwh = useMemo(() => {
        if (!activeFacility || !activeFacility.devices) return 0;
        return activeFacility.devices.reduce((acc, d) => {
          if (!d.isActive) return acc;
          return acc + ((d.wattage * d.quantity * d.hoursPerDay * d.daysPerMonth) / 1000);
        }, 0);
      }, [activeFacility]);

      // Saudi Tariff Calculation + Fixed Bill Rounding to nearest 0 or 5 with .00 halalas
      const billDetails = useMemo(() => {
        const isCommercial = activeFacility.tariffMode === 'commercial';
        const kwh = monthlyTotalKwh;
        const meter = activeFacility.meterFee || 10.00;

        let tier1Kwh = 0;
        let tier2Kwh = 0;
        let tier1Cost = 0;
        let tier2Cost = 0;
        let energyCost = 0;
        let isTier2 = false;

        if (isCommercial) {
          const rate = activeFacility.flatCommercialRate || 0.26;
          energyCost = kwh * rate;
          tier1Kwh = kwh;
          tier1Cost = energyCost;
        } else {
          const tier1Limit = 6000;
          tier1Kwh = Math.min(kwh, tier1Limit);
          tier2Kwh = Math.max(0, kwh - tier1Limit);
          tier1Cost = tier1Kwh * (activeFacility.tariffTier1Rate || 0.18);
          tier2Cost = tier2Kwh * (activeFacility.tariffTier2Rate || 0.30);
          energyCost = tier1Cost + tier2Cost;
          isTier2 = tier2Kwh > 0;
        }

        const subtotal = energyCost + meter;
        const vat = subtotal * 0.15;
        const baseGrandTotal = subtotal + vat;
        const priceAdjustment = baseGrandTotal * PRICE_ADJUSTMENT_RATE;
        const grandTotal = baseGrandTotal + priceAdjustment;

        // Calculate Fixed Monthly Average: zero halalas (.00) and ends strictly with 0 or 5
        const seasonalAvg = grandTotal * 0.96; // Realistic 12-month smoothed average
        const fixedMonthlyTotal = Math.max(5, Math.round(seasonalAvg / 5) * 5);

        const activeTotal = isFixedBill ? fixedMonthlyTotal : grandTotal;
        const dailyAvg = activeTotal / 30;

        return {
          isCommercial,
          tier1Kwh,
          tier2Kwh,
          tier1Cost,
          tier2Cost,
          energyCost,
          meter,
          subtotal,
          vat,
          priceAdjustment,
          grandTotal,
          fixedMonthlyTotal,
          activeTotal,
          dailyAvg,
          isTier2,
          tier1Percent: Math.min(100, (kwh / 6000) * 100),
          remainingToTier2: Math.max(0, 6000 - kwh)
        };
      }, [monthlyTotalKwh, activeFacility, isFixedBill]);

      // Environmental Sustainability Metrics
      const ecoImpact = useMemo(() => {
        const carbonFactor = 0.65;
        const treeAbsorption = 1.75;
        
        const currentCarbonKg = monthlyTotalKwh * carbonFactor;
        const baselineKwh = monthlyTotalKwh * 1.25;
        const savedKwh = Math.max(0, baselineKwh - monthlyTotalKwh);
        const savedCarbonKg = savedKwh * carbonFactor;
        const treesEquivalent = Math.max(0.1, (savedCarbonKg / treeAbsorption));

        const maxKwhBaseline = activeFacility.category === 'commercial' ? 35000 : activeFacility.category === 'institutional' ? 18000 : 8000;
        const efficiencyScore = Math.min(98, Math.max(15, Math.round((1 - (monthlyTotalKwh / (maxKwhBaseline * 1.1))) * 100)));

        return {
          currentCarbonKg: Math.round(currentCarbonKg),
          savedKwh: Math.round(savedKwh),
          savedCarbonKg: Math.round(savedCarbonKg),
          treesEquivalent: treesEquivalent.toFixed(1),
          annualTreesEquivalent: Math.round(treesEquivalent * 12),
          efficiencyScore
        };
      }, [monthlyTotalKwh, activeFacility]);

      // Live Telemetry Engine
      useEffect(() => {
        if (!isLiveRunning) return;

        const intervalMs = Math.max(250, 1500 / simSpeed);

        const timer = setInterval(() => {
          const newVolt = Number((218 + (Math.random() * 5.8)).toFixed(1));
          setVoltage(newVolt);

          const driftPercent = (Math.random() * 0.30) - 0.12;
          const currentDriftWatts = Math.round(baseWatts * driftPercent);
          setDriftOffset(currentDriftWatts);

          let currentSpikeWatts = 0;
          if (Math.random() < 0.20 && baseWatts > 0) {
            const timeStr = formatTimeEn();
            
            const eventPool = [
              { text: 'انطلاق ضاغط مكيف الصالة / الكمبروسر (+1,450 واط)', delta: 1450, type: 'spike' },
              { text: 'تشغيل مضخة المياه الدينمو / السخان (+1,200 واط)', delta: 1200, type: 'spike' },
              { text: 'فصل ثيرموستات المكيف تلقائياً (-1,380 واط)', delta: -1380, type: 'drop' },
              { text: 'فصل دورة تسخين سخان المياه (-950 واط)', delta: -950, type: 'drop' },
              { text: 'ارتفاع مفاجئ في سحب الشبكة (حمل ذروة متزامن)', delta: 2100, type: 'surge' },
              { text: 'تشغيل أجهزة الحاسب والمعالجة الرقمية (+780 واط)', delta: 780, type: 'spike' },
              { text: 'بدء دورة غسيل وتجفيف أوتوماتيكية (+1,600 واط)', delta: 1600, type: 'spike' }
            ];

            const chosen = eventPool[Math.floor(Math.random() * eventPool.length)];
            currentSpikeWatts = chosen.delta;

            setEventFeed(prev => [
              {
                id: Date.now(),
                text: chosen.text,
                type: chosen.type,
                time: timeStr,
                delta: (chosen.delta > 0 ? `+${formatNumber(chosen.delta)}` : `${formatNumber(chosen.delta)}`) + ' واط'
              },
              ...prev.slice(0, 19)
            ]);
          }

          const calculatedWatts = Math.max(0, Math.round(baseWatts + currentDriftWatts + currentSpikeWatts));
          const calculatedKw = calculatedWatts / 1000;
          const calculatedAmps = Number((calculatedWatts / newVolt).toFixed(1));
          const timestamp = formatTimeEn();

          setTelemetryHistory(prev => {
            const next = [...prev, {
              time: timestamp,
              watts: calculatedWatts,
              kw: calculatedKw,
              voltage: newVolt,
              current: calculatedAmps
            }];
            return next.length > 30 ? next.slice(next.length - 30) : next;
          });

          const effectiveKwhRate = activeFacility.tariffMode === 'commercial' 
            ? (activeFacility.flatCommercialRate || 0.26) 
            : (monthlyTotalKwh > 6000 ? 0.30 : 0.18);
          
          const costDelta = ((calculatedWatts / 1000) * effectiveKwhRate * 1.15 / 3600) * (1.5 * simSpeed) * (1 + PRICE_ADJUSTMENT_RATE);
          setAccumulatedCostSar(prev => prev + costDelta);

        }, intervalMs);

        return () => clearInterval(timer);
      }, [isLiveRunning, simSpeed, baseWatts, activeFacility, monthlyTotalKwh]);

      const latestReading = telemetryHistory[telemetryHistory.length - 1] || {
        watts: baseWatts,
        kw: (baseWatts / 1000).toFixed(2),
        voltage: 220.5,
        current: (baseWatts / 220.5).toFixed(1)
      };

      const handleSimulatePeakSurge = () => {
        if (soundEnabled) playHapticSound('surge');
        const surgeWatts = Math.round(3000 + (Math.random() * 2500));
        const timeStr = formatTimeEn();

        setEventFeed(prev => [
          {
            id: Date.now(),
            text: `⚠️ ضغط ذروة متزامن محاكى يدوياً (+${formatNumber(surgeWatts)} واط)! استجابة الحماية الذكية.`,
            type: 'surge',
            time: timeStr,
            delta: `+${formatNumber(surgeWatts)} واط`
          },
          ...prev.slice(0, 19)
        ]);

        setTelemetryHistory(prev => [
          ...prev,
          {
            time: timeStr,
            watts: Math.round(baseWatts + surgeWatts),
            kw: ((baseWatts + surgeWatts) / 1000).toFixed(2),
            voltage: 217.2,
            current: (((baseWatts + surgeWatts) / 217.2)).toFixed(1)
          }

          return {

      const handleHoursChange = (deviceId, delta) => {
        if (soundEnabled) playHapticSound('click');
        setFacilities(prev => prev.map(fac => {

              return { ...d, hoursPerDay: newHours };

      const handleDeleteDevice = (deviceId) => {
        if (soundEnabled) playHapticSound('click');
        if (confirm('هل أنت متأكد من حذف هذا الجهاز من المنشأة الحالية؟')) {

            return {

          }));

      const handleSaveDevice = (deviceData) => {

        setEditingDevice(null);
      };

      const handleCreateFacility = (facilityData) => {
        if (soundEnabled) playHapticSound('click');
        const newId = 'fac-' + Date.now();
        const newFac = {

          schedule: facilityData.schedule || 'جدول تشغيل مخصص',
          tariffMode: facilityData.tariffMode,
          tariffTier1Rate: facilityData.tariffMode === 'residential' ? 0.18 : undefined,
          tariffTier2Rate: facilityData.tariffMode === 'residential' ? 0.30 : undefined,
          flatCommercialRate: facilityData.tariffMode === 'commercial' ? Number(facilityData.flatRate || 0.26) : undefined,
          meterFee: Number(facilityData.meterFee || 15.00),
          devices: [
            { id: 'f1-1', name: 'مكيف هواء رئيسي (2 طن)', room: 'المساحة الرئيسية', wattage: 2200, quantity: 2, hoursPerDay: 10, daysPerMonth: 30, isActive: true, icon: 'wind' },
            { id: 'f1-2', name: 'إضاءة المنشأة (مجموعات LED)', room: 'عام', wattage: 40, quantity: 10, hoursPerDay: 8, daysPerMonth: 30, isActive: true, icon: 'lightbulb' },
            { id: 'f1-3', name: 'أجهزة ومعدات أساسية', room: 'عام', wattage: 500, quantity: 1, hoursPerDay: 12, daysPerMonth: 30, isActive: true, icon: 'zap' }
          ]
        };
        setFacilities(prev => [...prev, newFac]);
        setActiveFacilityId(newId);
        setShowAddFacilityModal(false);
      };

      const availableRooms = useMemo(() => {
        const set = new Set();
        (activeFacility.devices || []).forEach(d => set.add(d.room));
        return ['الكل', ...Array.from(set)];
      }, [activeFacility]);

      const filteredDevices = useMemo(() => {
        return (activeFacility.devices || []).filter(d => {
          const roomMatch = selectedRoomFilter === 'الكل' || d.room === selectedRoomFilter;
          const queryMatch = !searchQuery || d.name.toLowerCase().includes(searchQuery.toLowerCase()) || d.room.includes(searchQuery);
          return roomMatch && queryMatch;
        });
      }, [activeFacility, selectedRoomFilter, searchQuery]);

      const topDevices = useMemo(() => {
        return [...(activeFacility.devices || [])]
          .filter(d => d.isActive)
          .map(d => {
            const kwh = (d.wattage * d.quantity * d.hoursPerDay * d.daysPerMonth) / 1000;
            const percent = monthlyTotalKwh > 0 ? ((kwh / monthlyTotalKwh) * 100) : 0;
            const rate = activeFacility.tariffMode === 'commercial' ? (activeFacility.flatCommercialRate || 0.26) : (billDetails.isTier2 ? 0.24 : 0.18);
            const cost = kwh * rate * 1.15 * (1 + PRICE_ADJUSTMENT_RATE);
            return { ...d, kwh, percent, cost };
          })
          .sort((a, b) => b.kwh - a.kwh)
          .slice(0, 5);
      }, [activeFacility, monthlyTotalKwh, billDetails]);

      const handleTriggerPrint = () => {
        if (soundEnabled) playHapticSound('click');
        if (window.electronAPI && window.electronAPI.print) {
          window.electronAPI.print();
        } else {
          window.print();
        }
      };

      const handleWelcomeNameSave = (enteredName) => {
        const finalName = enteredName.trim() || DEFAULT_CUSTOMER_NAME;
        setCustomerName(finalName);
        localStorage.setItem('kafaa_customer_name', finalName);
        localStorage.setItem('kafaa_customer_name_initialized', 'true');
        setShowWelcomeNameModal(false);
        if (soundEnabled) playHapticSound('click');
      };

      return (
        <div className="min-h-screen flex flex-col transition-colors duration-300">

          {/* ===================== TOP HEADER & NAVIGATION (NO-PRINT) ===================== */}
          <header className="no-print sticky top-0 z-40 bg-white/85 dark:bg-[#121215]/90 backdrop-blur-2xl border-b border-black/[0.06] dark:border-white/[0.08] px-4 lg:px-8 py-3 select-none">
            <div className="max-w-7xl mx-auto flex items-center justify-between gap-4">
              
              {/* Brand & Platform Identity */}
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-apple-blue to-[#0051A8] flex items-center justify-center text-white shadow-md shadow-apple-blue/25">
                  <Icon name="zap" className="w-5 h-5" />
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-heading font-black text-xl text-gray-950 dark:text-white">{appName}</span>
                    <span className="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full bg-apple-blue/10 text-apple-blue">
                      إدارة الطاقة
                    </span>
                  </div>
                  <p className="text-xs text-apple-gray dark:text-gray-400 font-medium">
                    إدارة استهلاك الطاقة والاستدامة البيئية بالمملكة
                  </p>
                </div>
              </div>

              {/* Central Navigation Pills */}
              <div className="hidden md:flex items-center bg-black/[0.04] dark:bg-white/[0.06] p-1 rounded-2xl border border-black/[0.04] dark:border-white/[0.05] text-xs font-bold">
                <button
                  onClick={() => { setActiveView('telemetry'); if(soundEnabled) playHapticSound('click'); }}
                  className={`px-4 py-2 rounded-xl transition-all ${
                    activeView === 'telemetry'
                      ? 'bg-white dark:bg-zinc-800 text-apple-blue dark:text-white shadow-sm'
                      : 'text-gray-600 dark:text-gray-400 hover:text-black dark:hover:text-white'
                  }`}
                >
                  ⚡ المراقبة اللحظية والمحاكي
                </button>
                <button
                  onClick={() => { setActiveView('devices'); if(soundEnabled) playHapticSound('click'); }}
                  className={`px-4 py-2 rounded-xl transition-all ${
                    activeView === 'devices'
                      ? 'bg-white dark:bg-zinc-800 text-apple-blue dark:text-white shadow-sm'
                      : 'text-gray-600 dark:text-gray-400 hover:text-black dark:hover:text-white'
                  }`}
                >
                  🔌 الأجهزة وساعات التشغيل
                </button>
                <button
                  onClick={() => { setActiveView('analytics'); if(soundEnabled) playHapticSound('click'); }}
                  className={`px-4 py-2 rounded-xl transition-all ${
                    activeView === 'analytics'
                      ? 'bg-white dark:bg-zinc-800 text-apple-green dark:text-white shadow-sm'
                      : 'text-gray-600 dark:text-gray-400 hover:text-black dark:hover:text-white'
                  }`}
                >
                  🌿 الاستدامة البيئية
                </button>
                <button
                  onClick={() => { setActiveView('audit'); if(soundEnabled) playHapticSound('click'); }}
                  className={`px-4 py-2 rounded-xl transition-all ${
                    activeView === 'audit'
                      ? 'bg-white dark:bg-zinc-800 text-apple-purple dark:text-white shadow-sm'
                      : 'text-gray-600 dark:text-gray-400 hover:text-black dark:hover:text-white'

              </div>

              {/* Action Buttons */}
              <div className="flex items-center gap-2">
                <button

                  className="hidden sm:flex items-center gap-1.5 px-3 py-2 rounded-xl border border-black/[0.06] dark:border-white/[0.08] hover:bg-black/[0.04] dark:hover:bg-white/[0.06] text-xs font-bold text-gray-700 dark:text-gray-200 transition-colors"
                  title="تعديل الاسم الظاهر في التقرير"
                >

                  className="p-2 rounded-xl border border-black/[0.06] dark:border-white/[0.08] hover:bg-black/[0.04] dark:hover:bg-white/[0.06] text-gray-700 dark:text-gray-300 transition-colors"

                  title="طباعة التقرير التقديري"

            </div>
          </header>

          {/* ===================== SCREEN DASHBOARD CONTENT (NO-PRINT) ===================== */}
          <div className="screen-dashboard-container flex-1 max-w-7xl w-full mx-auto p-4 lg:p-8 space-y-6">

            {/* ===================== PROJECT INFORMATION BANNER ===================== */}
            <div className="relative overflow-hidden bg-gradient-to-l from-blue-50 via-white to-emerald-50 dark:from-blue-950/60 dark:via-zinc-900 dark:to-emerald-950/50 rounded-3xl p-5 border border-blue-200/70 dark:border-emerald-800/50 shadow-apple">
              <div className="flex items-center gap-4">
                <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-apple-blue to-apple-green text-white flex items-center justify-center flex-shrink-0 shadow-md shadow-apple-blue/20">

                          <line x1="0" y1="110" x2="600" y2="110" stroke="currentColor" strokeOpacity="0.08" strokeDasharray="3,3" />
                          <line x1="0" y1="180" x2="600" y2="180" stroke="currentColor" strokeOpacity="0.08" strokeDasharray="3,3" />

                            const points = telemetryHistory;
                            const maxVal = Math.max(...points.map(p => p.watts), baseWatts * 1.4, 1000);
                            const minVal = Math.max(0, Math.min(...points.map(p => p.watts)) * 0.85);
                            const range = (maxVal - minVal) || 1;

                            const coords = points.map((p, idx) => {
                              const x = (idx / (points.length - 1)) * 600;
                              const y = 200 - (((p.watts - minVal) / range) * 170);
                              return { x, y, watts: p.watts };
                            });

                            let pathD = `M ${coords[0].x} ${coords[0].y}`;
                            for (let i = 0; i < coords.length - 1; i++) {
                              const p0 = coords[i];
                              const p1 = coords[i + 1];
                              const mx = (p0.x + p1.x) / 2;
                              pathD += ` C ${mx} ${p0.y}, ${mx} ${p1.y}, ${p1.x} ${p1.y}`;
                            }

                            const fillD = `${pathD} L 600 220 L 0 220 Z`;

                            return (
                              <>
                                <path d={fillD} fill="url(#chartGradient)" />
                                <path d={pathD} fill="none" stroke="#0071E3" strokeWidth="2.5" strokeLinecap="round" />
                                {coords.map((c, i) => (

                                    key={i}
                                    cx={c.x}
                                    cy={c.y}
                                    r={i === coords.length - 1 ? 5 : 2}
                                    fill={i === coords.length - 1 ? '#34C759' : '#0071E3'}
                                    stroke="#FFFFFF"
                                    strokeWidth="1.5"
                                  />
                                ))}
                              </>
                            );

      const [quantity, setQuantity] = useState(deviceToEdit?.quantity || 1);
      const [hoursPerDay, setHoursPerDay] = useState(deviceToEdit?.hoursPerDay || 8);
      const [daysPerMonth, setDaysPerMonth] = useState(deviceToEdit?.daysPerMonth || 30);
      const [icon, setIcon] = useState(deviceToEdit?.icon || 'zap');

      const handlePresetSelect = (p) => {
        setName(p.name);
        setWattage(p.wattage);
        setRoom(p.room);
        setIcon(p.icon);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) return alert('الرجاء كتابة اسم الجهاز');
        onSave({
          name: name.trim(),
          room,
          wattage: Number(wattage),
          quantity: Number(quantity),
          hoursPerDay: Number(hoursPerDay),
          daysPerMonth: Number(daysPerMonth),
          icon,
          isActive: deviceToEdit ? deviceToEdit.isActive : true
        });
      };

      return (
        <div className="no-print fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-md animate-fade-in text-right" dir="rtl">
          <div className="bg-white dark:bg-zinc-900 rounded-3xl max-w-2xl w-full border border-black/[0.08] dark:border-white/[0.1] shadow-2xl overflow-hidden">
            <div className="p-6 border-b border-black/[0.06] dark:border-white/[0.08] flex items-center justify-between">
              <div>
                <h3 className="font-heading font-bold text-lg text-gray-950 dark:text-white">
                  {deviceToEdit ? 'تعديل بيانات الجهاز' : 'إضافة جهاز جديد إلى المنشأة'}
                </h3>
                <p className="text-xs text-apple-gray dark:text-gray-400 mt-0.5">
                  اختر من مكتبة الأجهزة الذكية للتعبئة التلقائية للقدرة بالواط
                </p>
              </div>
              <button onClick={onClose} className="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-zinc-800 text-gray-500">
                <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 6L6 18M6 6l12 12" strokeWidth="2" strokeLinecap="round"/></svg>
              </button>
            </div>

            <div className="p-6 pb-3 border-b border-black/[0.04] dark:border-white/[0.05] bg-gray-50/50 dark:bg-zinc-800/30">
              <span className="text-xs font-bold text-apple-gray dark:text-gray-400 block mb-2">
                مكتبة الأجهزة الجاهزة (تعبئة فورية بالواط):
              </span>
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 max-h-36 overflow-y-auto pr-1">
                {presets.map((p, idx) => (
                  <button
                    key={idx}
                    type="button"
                    onClick={() => handlePresetSelect(p)}
                    className="p-2 rounded-xl border border-black/[0.06] dark:border-white/[0.08] bg-white dark:bg-zinc-800 hover:border-apple-blue hover:bg-apple-blue/5 text-right transition-all group"
                  >
                    <div className="flex items-center gap-1.5 text-xs font-semibold text-gray-800 dark:text-gray-200 group-hover:text-apple-blue">
                      <Icon name={p.icon} className="w-3.5 h-3.5 flex-shrink-0 text-apple-blue" />
                      <span className="truncate">{p.name}</span>
                    </div>
                    <div className="text-[11px] text-apple-gray dark:text-gray-400 tabular-nums mt-0.5 num-font">
                      {formatNumber(p.wattage)} واط
                    </div>
                  </button>
                ))}
              </div>
            </div>

            <form onSubmit={handleSubmit} className="p-6 space-y-4">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">اسم الجهاز</label>
                  <input
                    type="text"
                    required
                    value={name}
                    onChange={(e) => setName(e.target.value)}
                    placeholder="مثال: مكيف الصالة"
                    className="w-full px-3 py-2 rounded-xl text-xs bg-gray-50 dark:bg-zinc-800 border border-black/[0.08] dark:border-white/[0.1] text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-apple-blue text-right"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">المساحة / القسم</label>
                  <input
                    type="text"
                    required
                    value={room}
                    onChange={(e) => setRoom(e.target.value)}
                    placeholder="مثال: الصالة أو الفصول أو المكاتب"
                    className="w-full px-3 py-2 rounded-xl text-xs bg-gray-50 dark:bg-zinc-800 border border-black/[0.08] dark:border-white/[0.1] text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-apple-blue text-right"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">القدرة الكهربائية (واط)</label>
                  <input
                    type="number"
                    required
                    min="1"
                    max="80000"
                    value={wattage}
                    onChange={(e) => setWattage(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl text-xs bg-gray-50 dark:bg-zinc-800 border border-black/[0.08] dark:border-white/[0.1] text-gray-900 dark:text-white tabular-nums focus:outline-none focus:ring-2 focus:ring-apple-blue text-right num-font"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">العدد</label>
                  <input
                    type="number"
                    required
                    min="1"
                    max="200"
                    value={quantity}
                    onChange={(e) => setQuantity(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl text-xs bg-gray-50 dark:bg-zinc-800 border border-black/[0.08] dark:border-white/[0.1] text-gray-900 dark:text-white tabular-nums focus:outline-none focus:ring-2 focus:ring-apple-blue text-right num-font"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">ساعات التشغيل اليومية ({formatNumber(hoursPerDay, 1)} س)</label>
                  <input
                    type="number"
                    step="0.5"
                    min="0.5"
                    max="24"
                    value={hoursPerDay}
                    onChange={(e) => setHoursPerDay(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl text-xs bg-gray-50 dark:bg-zinc-800 border border-black/[0.08] dark:border-white/[0.1] text-gray-900 dark:text-white tabular-nums focus:outline-none focus:ring-2 focus:ring-apple-blue text-right num-font"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">أيام التشغيل بالشهر</label>
                  <input
                    type="number"
                    min="1"
                    max="31"
                    value={daysPerMonth}
                    onChange={(e) => setDaysPerMonth(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl text-xs bg-gray-50 dark:bg-zinc-800 border border-black/[0.08] dark:border-white/[0.1] text-gray-900 dark:text-white tabular-nums focus:outline-none focus:ring-2 focus:ring-apple-blue text-right num-font"
                  />
                </div>
              </div>

              <div className="pt-4 border-t border-black/[0.06] dark:border-white/[0.08] flex items-center justify-end gap-3">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 rounded-xl border border-black/[0.08] dark:border-white/[0.1] text-xs font-semibold text-gray-600 dark:text-gray-300"
                >
                  إلغاء
                </button>
                <button
                  type="submit"
                  className="px-6 py-2 rounded-xl bg-apple-blue hover:bg-apple-blue-hover text-white text-xs font-bold shadow-md shadow-apple-blue/20"
                >
                  {deviceToEdit ? 'حفظ التعديلات' : 'إضافة الجهاز'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // =========================================================================
    // MODAL: ADD CUSTOM FACILITY
    // =========================================================================
    function AddFacilityModal({ isOpen, onClose, onSave }) {
      const [name, setName] = useState('');
      const [category, setCategory] = useState('residential');
      const [tariffMode, setTariffMode] = useState('residential');
      const [flatRate, setFlatRate] = useState(0.26);
      const [meterFee, setMeterFee] = useState(15.00);
      const [schedule, setSchedule] = useState('تشغيل اعتيادي');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) return alert('الرجاء كتابة اسم المنشأة');
        onSave({
          name: name.trim(),
          category,
          tariffMode,
          flatRate: Number(flatRate),
          meterFee: Number(meterFee),
          schedule: schedule.trim()
        });
      };

      return (
        <div className="no-print fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-md animate-fade-in text-right" dir="rtl">
          <div className="bg-white dark:bg-zinc-900 rounded-3xl max-w-lg w-full border border-black/[0.08] dark:border-white/[0.1] shadow-2xl overflow-hidden">
            <div className="p-6 border-b border-black/[0.06] dark:border-white/[0.08] flex items-center justify-between">
              <div>
                <h3 className="font-heading font-bold text-lg text-gray-950 dark:text-white">
                  إضافة ملف منشأة مخصصة جديدة
                </h3>
                <p className="text-xs text-apple-gray dark:text-gray-400 mt-0.5">
                  إنشاء ملف مستقل بجدول تشغيل وتعريفة خاصة محفوظة في الذاكرة المحلية
                </p>
              </div>
              <button onClick={onClose} className="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-zinc-800 text-gray-500">
                <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 6L6 18M6 6l12 12" strokeWidth="2" strokeLinecap="round"/></svg>
              </button>
            </div>

            <form onSubmit={handleSubmit} className="p-6 space-y-4">
              <div>
                <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">اسم المنشأة</label>
                <input
                  type="text"
                  required
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                  placeholder="مثال: مجمع عيادات أو مستودع أو فرع مصرف"
                  className="w-full px-3 py-2 rounded-xl text-xs bg-gray-50 dark:bg-zinc-800 border border-black/[0.08] dark:border-white/[0.1] text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-apple-blue text-right"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">نوع التصنيف</label>
                  <select
                    value={category}
                    onChange={(e) => {
                      setCategory(e.target.value);
                      if (e.target.value === 'commercial' || e.target.value === 'institutional') {
                        setTariffMode('commercial');
                      } else {
                        setTariffMode('residential');
                      }
                    }}
                    className="w-full px-3 py-2 rounded-xl text-xs bg-gray-50 dark:bg-zinc-800 border border-black/[0.08] dark:border-white/[0.1] text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-apple-blue text-right"
                  >
                    <option value="residential">سكني (منازل وفلل)</option>
                    <option value="commercial">تجاري (مكاتب وأسواق)</option>
                    <option value="institutional">مؤسسي (مدارس ومراكز)</option>
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">نظام التعريفة</label>
                  <select
                    value={tariffMode}
                    onChange={(e) => setTariffMode(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl text-xs bg-gray-50 dark:bg-zinc-800 border border-black/[0.08] dark:border-white/[0.1] text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-apple-blue text-right"
                  >
                    <option value="residential">سكني بالشرائح</option>
                    <option value="commercial">تجاري موحد</option>
                  </select>
                  <div className="mt-1 text-[10px] text-apple-gray flex flex-wrap items-center gap-1">
                    <span>التعريفة لكل كيلوواط ساعة:</span>
                    {tariffMode === 'residential'
                      ? <><SaudiCurrencyDisplay amount={0.18} decimals={2} size="text-[10px]" color="text-gray-700 dark:text-gray-300" /> و <SaudiCurrencyDisplay amount={0.30} decimals={2} size="text-[10px]" color="text-gray-700 dark:text-gray-300" /></>
                      : <SaudiCurrencyDisplay amount={flatRate} decimals={2} size="text-[10px]" color="text-gray-700 dark:text-gray-300" />}
                  </div>
                </div>
              </div>

              {tariffMode === 'commercial' && (
                <div>
                  <label className="mb-1 flex items-center gap-1 text-xs font-bold text-gray-700 dark:text-gray-300">
                    سعر الكيلوواط التجاري (<SaudiRiyalSymbol className="w-3 h-3" /> / كيلوواط ساعة)
                  </label>
                  <input
                    type="number"
                    step="0.01"
                    value={flatRate}
                    onChange={(e) => setFlatRate(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl text-xs bg-gray-50 dark:bg-zinc-800 border border-black/[0.08] dark:border-white/[0.1] text-gray-900 dark:text-white tabular-nums text-right num-font"
                  />
                </div>
              )}

              <div>
                <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">جدول ومواعيد التشغيل</label>
                <input
                  type="text"
                  value={schedule}
                  onChange={(e) => setSchedule(e.target.value)}
                  placeholder="مثال: يومياً من 8 ص إلى 6 م"
                  className="w-full px-3 py-2 rounded-xl text-xs bg-gray-50 dark:bg-zinc-800 border border-black/[0.08] dark:border-white/[0.1] text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-apple-blue text-right"
                />
              </div>

              <div className="pt-4 border-t border-black/[0.06] dark:border-white/[0.08] flex items-center justify-end gap-3">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 rounded-xl border border-black/[0.08] dark:border-white/[0.1] text-xs font-semibold text-gray-600 dark:text-gray-300"
                >
                  إلغاء
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 rounded-xl bg-apple-blue text-white text-xs font-bold shadow-md shadow-apple-blue/20"
                >
                  إنشاء المنشأة
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Mount React Root
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<KafaaApp />);
  </script>
</body>
</html>
